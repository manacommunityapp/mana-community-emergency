spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-key-for-testing-only-not-for-production-use-at-all
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - "http://localhost:5173"

emergency:
  default-sla:
    ack-timeout-seconds: 60
    assign-timeout-seconds: 120
    on-scene-timeout-seconds: 300
  watchdog:
    check-interval-ms: 10000
